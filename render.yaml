services:
  - type: web
    name: campus-market
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-market-db
          property: connectionString

databases:
  - name: campus-market-db
    databaseName: campus_market
